<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f172a">
<title>Fatura Yükle</title>
<style>
  :root { --bg:#0f172a; --kart:#1e293b; --yazi:#f1f5f9; --soluk:#94a3b8; --vurgu:#38bdf8; --iyi:#4ade80; --kotu:#f87171; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--yazi); font:16px/1.4 system-ui, sans-serif; padding:16px; max-width:640px; margin-inline:auto; }
  h1 { font-size:20px; margin:0 0 4px; }
  p.alt { color:var(--soluk); margin:0 0 14px; font-size:14px; }
  .sat { background:var(--kart); border-radius:12px; padding:12px 14px; margin-bottom:10px; display:flex; gap:10px; align-items:center; }
  .sat .bilgi { flex:1; min-width:0; }
  .sat .ust { font-weight:600; }
  .sat .alt2 { color:var(--soluk); font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  button, label.dugme { background:var(--vurgu); color:#04293a; border:0; border-radius:10px; padding:10px 14px; font:600 15px system-ui; cursor:pointer; }
  button.ikinci { background:#334155; color:var(--yazi); }
  input[type=file] { display:none; }
  input[type=password], input[type=text] { width:100%; padding:10px; border-radius:8px; border:1px solid #475569; background:#0b1220; color:var(--yazi); font-size:16px; margin:8px 0; }
  #durum { position:sticky; top:0; padding:10px 12px; border-radius:10px; margin-bottom:12px; background:#334155; display:none; }
  #durum.iyi { background:#14532d; } #durum.kotu { background:#7f1d1d; } #durum.bekle { background:#1e3a5f; }
  .ust-bar { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; gap:8px; }
  .gizli { display:none; }
  .rozet { color:var(--iyi); font-size:13px; }
</style>
</head>
<body>
<h1>Fatura Yükle</h1>
<p class="alt">Belgesi olmayan giderin yanındaki “Fotoğraf” düğmesine dokunun, fişi çekin. Foto küçültülüp güvenli yere kaydedilir.</p>
<div id="durum"></div>

<div id="giris" class="gizli">
  <p>Uygulamanın parolasını bir kez girin (bu telefonda saklanır).</p>
  <input id="parola" type="password" placeholder="Parola" autocomplete="current-password">
  <button id="parolaKaydet">Kaydet</button>
</div>

<div id="ana" class="gizli">
  <div class="ust-bar">
    <label><input type="checkbox" id="hepsi"> Belgesi olanları da göster</label>
    <button class="ikinci" id="yenile">Yenile</button>
  </div>
  <div id="liste"></div>
</div>

<input id="dosya" type="file" accept="image/*" capture="environment">

<script>
(function () {
  var yerel = /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
  var API = yerel ? 'http://127.0.0.1:8070' : 'https://arac-takip-1.onrender.com';
  var TOKEN_KEY = 'aracTakipToken'; // ana uygulamayla ayni anahtar: orada girildiyse burada da hazir
  var el = function (id) { return document.getElementById(id); };
  var seciliId = null;

  function token() { try { return localStorage.getItem(TOKEN_KEY) || ''; } catch (e) { return ''; } }
  function durum(metin, tur) { var d = el('durum'); d.textContent = metin; d.className = tur || ''; d.style.display = metin ? 'block' : 'none'; }
  function tl(n) { return Number(n).toLocaleString('tr-TR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' TL'; }
  function tarih(s) { var p = String(s).split('-'); return p.length === 3 ? p[2] + '.' + p[1] + '.' + p[0] : s; }

  function istek(yol, secenek) {
    secenek = secenek || {};
    secenek.headers = Object.assign({ 'X-App-Token': token() }, secenek.headers || {});
    return fetch(API + yol, secenek).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) {
        if (r.status === 401) { el('giris').classList.remove('gizli'); el('ana').classList.add('gizli'); throw new Error('Parola yanlış veya eksik'); }
        if (!r.ok) throw new Error(j.error || ('Hata ' + r.status));
        return j;
      });
    });
  }

  function yukle() {
    durum('Kayıtlar getiriliyor… (sunucu uyuyorsa ilk açılış bir dakika sürebilir)', 'bekle');
    istek('/api/fatura/liste' + (el('hepsi').checked ? '?hepsi=1' : '')).then(function (satirlar) {
      el('giris').classList.add('gizli'); el('ana').classList.remove('gizli');
      var kutu = el('liste'); kutu.textContent = '';
      if (!satirlar.length) { kutu.textContent = 'Belgesi eksik kayıt yok.'; }
      satirlar.forEach(function (g) {
        var s = document.createElement('div'); s.className = 'sat';
        var b = document.createElement('div'); b.className = 'bilgi';
        var u = document.createElement('div'); u.className = 'ust'; u.textContent = g.plaka + ' · ' + tl(g.tutar);
        var a = document.createElement('div'); a.className = 'alt2'; a.textContent = tarih(g.tarih) + ' · ' + (g.firma || '') + ' · ' + (g.kategori || '');
        b.appendChild(u); b.appendChild(a); s.appendChild(b);
        if (g.belge_adi) {
          var r = document.createElement('span'); r.className = 'rozet'; r.textContent = '✓ belge var'; s.appendChild(r);
          var gb = document.createElement('button'); gb.className = 'ikinci'; gb.textContent = 'Göster';
          gb.onclick = function () { goster(g.id); }; s.appendChild(gb);
        }
        var fb = document.createElement('button'); fb.textContent = g.belge_adi ? 'Değiştir' : 'Fotoğraf';
        fb.onclick = function () { seciliId = g.id; el('dosya').value = ''; el('dosya').click(); }; s.appendChild(fb);
        kutu.appendChild(s);
      });
      durum('');
    }).catch(function (e) { durum(e.message, 'kotu'); });
  }

  function goster(id) {
    var pencere = window.open('', '_blank');
    istek('/api/fatura/' + id + '/url').then(function (j) { if (pencere) pencere.location = j.url; else location.href = j.url; })
      .catch(function (e) { if (pencere) pencere.close(); durum(e.message, 'kotu'); });
  }

  // Foto uzun kenari en cok 1600 px, JPEG kalite 0.7 olacak sekilde kucultulur
  function kucult(dosya) {
    return new Promise(function (coz, red) {
      var url = URL.createObjectURL(dosya), img = new Image();
      img.onload = function () {
        var k = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight));
        var c = document.createElement('canvas');
        c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        c.toBlob(function (b) { b ? coz(b) : red(new Error('Foto küçültülemedi')); }, 'image/jpeg', 0.7);
      };
      img.onerror = function () { URL.revokeObjectURL(url); red(new Error('Foto açılamadı')); };
      img.src = url;
    });
  }

  el('dosya').addEventListener('change', function () {
    var f = this.files && this.files[0]; if (!f || !seciliId) return;
    var id = seciliId;
    durum('Foto küçültülüyor…', 'bekle');
    kucult(f).then(function (blob) {
      durum('Yükleniyor (' + Math.round(blob.size / 1024) + ' KB)…', 'bekle');
      return istek('/api/fatura/' + id, { method: 'POST', headers: { 'Content-Type': 'image/jpeg' }, body: blob });
    }).then(function () { durum('Kaydedildi ✓', 'iyi'); yukle(); setTimeout(function () { if (el('durum').className === 'iyi') durum(''); }, 2500); })
      .catch(function (e) { durum('Olmadı: ' + e.message, 'kotu'); });
  });

  el('parolaKaydet').onclick = function () {
    var p = el('parola').value.trim(); if (!p) return;
    try { localStorage.setItem(TOKEN_KEY, p); } catch (e) { durum('Bu tarayıcı parolayı saklayamıyor', 'kotu'); return; }
    el('parola').value = ''; yukle();
  };
  el('hepsi').onchange = yukle; el('yenile').onclick = yukle;
  if (token()) yukle(); else { el('giris').classList.remove('gizli'); }
})();
</script>
</body>
</html>
